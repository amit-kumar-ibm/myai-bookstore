spring.application.name=MyAi

# Bind to loopback only
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# PostgreSQL (default profile). The database credential is not stored in this file; Spring Boot
# reads it from the SPRING_DATASOURCE_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USER:bookstore}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The JWT signing key is read from the APP_JWT_SECRET environment variable (>= 32 bytes).
# If it is not set, a random ephemeral key is generated at startup (development only).
app.jwt.ttl-seconds=3600

# GST-style tax applied to the cart subtotal (12% matches the wireframe: 62 on 508 -> ~12%)
app.tax-rate=0.12

# Seed the wireframe catalogue when the books table is empty
app.seed-catalog=true
