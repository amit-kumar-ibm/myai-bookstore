openapi: 3.0.3
info:
  title: Book Worm E-Bookstore API
  version: 0.0.1
  description: |
    Backend for the e-bookstore capstone. Covers the customer journeys from the use case:
    login, landing page with recommendations, catalogue browsing (category / brand / product),
    basket, address selection, payment with gift points, purchase confirmation, order history
    with "Buy In Again", and cancellation within 48 hours.

    Payment is simulated. No card data is accepted or stored; a real gateway integration must
    tokenise cards client-side.
servers:
  - url: http://127.0.0.1:8080
    description: Local (the service binds to loopback only)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalogue
  - name: Cart
  - name: Addresses
  - name: Orders
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Auth]
      summary: Current user profile including gift-point balance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/home:
    get:
      tags: [Catalogue]
      summary: Landing page (public; personalised when a token is supplied)
      description: Recommended for you (based on order history), bestsellers this month, new launches.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
  /api/categories:
    get:
      tags: [Catalogue]
      summary: List categories (left navigation)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /api/publishers:
    get:
      tags: [Catalogue]
      summary: List brands (publishers), optionally for one category
      security: []
      parameters:
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/books:
    get:
      tags: [Catalogue]
      summary: Search and filter the catalogue
      security: []
      parameters:
        - { name: q, in: query, description: Title or author text, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/BookFormat' } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, priceAsc, priceDesc, rating, newest] }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/books/{id}:
    get:
      tags: [Catalogue]
      summary: Product detail with tentative delivery date and related reads
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cart:
    get:
      tags: [Cart]
      summary: View the basket
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add a product to the basket (quantities accumulate)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddToCartRequest' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Change a line quantity
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: Remove a line from the basket
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/addresses:
    get:
      tags: [Addresses]
      summary: List saved delivery addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Addresses]
      summary: Save a delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/addresses/{id}:
    delete:
      tags: [Addresses]
      summary: Delete a saved address
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders:
    post:
      tags: [Orders]
      summary: Pay and purchase the basket
      description: |
        Validates the address and stock, optionally redeems gift points (1 point = INR 1, capped at
        the payable amount and the balance), simulates payment, decrements stock, awards 1 point per
        INR 100 paid, and empties the basket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Purchase confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: Order history (newest first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
  /api/orders/buy-again:
    get:
      tags: [Orders]
      summary: Previously purchased books ("Buy In Again")
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order within 48 hours of purchase
      description: Restocks the books, marks payment refunded and reverses gift points.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation or business-rule failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid or expired token / bad credentials
    NotFound:
      description: Resource not found (also returned for other users' resources)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with current state (duplicate, out of stock, not cancellable)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
        instance: { type: string }
        errors: { type: array, items: { type: string } }
    BookFormat: { type: string, enum: [PAPERBACK, HARDCOVER, EBOOK] }
    Section: { type: string, enum: [STANDARD, BESTSELLER, NEW_LAUNCH] }
    PaymentMethod: { type: string, enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET] }
    PaymentStatus: { type: string, enum: [PAID, REFUNDED] }
    OrderStatus: { type: string, enum: [PLACED, CANCELLED] }
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72, format: password }
        name: { type: string, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 72, format: password }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        giftPoints: { type: integer, format: int64 }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Book:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        publisher: { type: string }
        description: { type: string }
        price: { type: number }
        format: { $ref: '#/components/schemas/BookFormat' }
        language: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        stock: { type: integer }
        rating: { type: number }
        copiesSold: { type: integer }
        section: { $ref: '#/components/schemas/Section' }
        tentativeDeliveryDate: { type: string, format: date }
    BookDetail:
      type: object
      properties:
        book: { $ref: '#/components/schemas/Book' }
        relatedBooks:
          type: array
          items: { $ref: '#/components/schemas/Book' }
    BookPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Home:
      type: object
      properties:
        recommended: { type: array, items: { $ref: '#/components/schemas/Book' } }
        bestsellers: { type: array, items: { $ref: '#/components/schemas/Book' } }
        newLaunches: { type: array, items: { $ref: '#/components/schemas/Book' } }
    AddToCartRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
    CartItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        book: { $ref: '#/components/schemas/Book' }
        quantity: { type: integer }
        lineTotal: { type: number }
    Cart:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        tentativeDeliveryDate: { type: string, format: date, nullable: true }
    AddressRequest:
      type: object
      required: [firstName, lastName, line1, city, state, pin, country, phone]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        pin: { type: string, pattern: '^\d{6}$' }
        country: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^\+?[0-9]{7,15}$' }
    Address:
      allOf:
        - { $ref: '#/components/schemas/AddressRequest' }
        - type: object
          properties:
            id: { type: integer, format: int64 }
    CheckoutRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId: { type: integer, format: int64 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        giftPointsToRedeem: { type: integer, format: int64, minimum: 0, default: 0 }
    OrderItem:
      type: object
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentReference: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        address: { $ref: '#/components/schemas/Address' }
        subtotal: { type: number }
        tax: { type: number }
        discount: { type: number }
        total: { type: number }
        giftPointsRedeemed: { type: integer, format: int64 }
        giftPointsEarned: { type: integer, format: int64 }
        estimatedDelivery: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        cancellableUntil: { type: string, format: date-time }
